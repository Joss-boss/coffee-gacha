  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #e2ded4;
      background-image: 
        radial-gradient(at 10% 20%, rgba(224, 98, 88, 0.25) 0px, transparent 50%),
        radial-gradient(at 80% 0%, rgba(77, 182, 172, 0.3) 0px, transparent 50%),
        radial-gradient(at 90% 80%, rgba(244, 180, 26, 0.25) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(26, 35, 126, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      margin: 0;
      padding: 30px 15px;
      color: #1a1a24;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 28px 20px 32px 18px;
      padding: 30px 25px;
      box-shadow: 0 12px 32px rgba(26, 26, 42, 0.08), 
                  inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .card-title {
      margin: 0 0 20px 0;
      font-size: 22px;
      font-weight: 800;
      color: #111439;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 룰렛 스타일 */
    .roulette-section { text-align: center; }
    .roulette-wrapper {
      position: relative;
      width: 290px;
      height: 290px;
      margin: 25px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #111439;
      z-index: 12;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    #wheel {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      transition: transform 3.5s cubic-bezier(0.12, 0.8, 0.15, 1);
    }

    .wheel-center-stamp {
      position: absolute;
      width: 70px;
      height: 70px;
      background: #ffffff;
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 3px solid #111439;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .wheel-center-stamp img {
      width: 58px;
      height: 58px;
    }

    .btn-action {
      background: #111439;
      color: #f7f9fc;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px 12px 28px 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(17, 20, 57, 0.25);
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      transform: translateY(-2px) scale(1.02);
      background: #23286b;
      box-shadow: 0 10px 24px rgba(17, 20, 57, 0.35);
    }
    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #result {
      font-size: 18px;
      font-weight: 700;
      margin-top: 20px;
      color: #e04850;
      min-height: 27px;
    }

    /* 캘린더 디자인 */
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn-nav {
      background: #f0eee6;
      color: #111439;
      border: none;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-nav:hover { background: #e2decb; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-header {
      text-align: center;
      font-weight: 800;
      padding: 8px 0;
      color: #717588;
      font-size: 13px;
    }
    .day-header.sun { color: #e04850; }
    .day-header.sat { color: #3b82f6; }

    .day-cell {
      min-height: 105px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(0,0,0,0.05);
      border-radius: 16px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      overflow: hidden;
    }

    .day-cell.is-off {
      background: rgba(230, 225, 218, 0.5);
    }

    /* 오늘 날짜 강조 스타일 */
    .day-cell.is-today {
      background: rgba(255, 243, 205, 0.95);
      border: 2px solid #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
    }
    .day-cell.is-today .day-number {
      background: #f59e0b;
      color: #ffffff !important;
      padding: 1px 6px;
      border-radius: 6px;
      display: inline-block;
      width: fit-content;
    }

    .day-number {
      font-size: 12px;
      font-weight: 700;
      color: #4a4e69;
    }
    .day-cell.sun .day-number,
    .day-cell.is-kr-holiday .day-number { color: #e04850; }
    .day-cell.sat .day-number { color: #3b82f6; }

    .holiday-badge-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 2px;
    }

    .holiday-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 4px;
      border-radius: 4px;
      line-height: 1.1;
      word-break: keep-all;
    }
    .badge-kr { background: #ffebee; color: #d32f2f; }
    .badge-vn { background: #e8f5e9; color: #2e7d32; }
    .badge-hk { background: #fff3e0; color: #ef6c00; }
    .badge-ny { background: #e3f2fd; color: #1565c0; }

      width: 100%;
      font-size: 11px;
      font-weight: 700;
      padding: 5px;
      border-radius: 8px;
      border: 1px solid #dcd8c8;
