    .card-title {
      margin: 0 0 20px 0;
      font-size: 22px;
      font-weight: 800;
      color: #111439;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;

    .roulette-wrapper {
      position: relative;
      width: 290px;
      height: 290px;
      margin: 25px auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #111439;
      z-index: 12;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }

    #wheel {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      transition: transform 3.5s cubic-bezier(0.12, 0.8, 0.15, 1);
    }

    .wheel-center-stamp {
      position: absolute;
      width: 70px;
      height: 70px;
      background: #ffffff;
      border-radius: 50%;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 3px solid #111439;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .wheel-center-stamp img {
      width: 58px;
      height: 58px;
    }

    .btn-action {
      background: #111439;
      color: #f7f9fc;
      border: none;
      padding: 14px 36px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 30px 12px 28px 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(17, 20, 57, 0.25);
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      transform: translateY(-2px) scale(1.02);
      background: #23286b;
      box-shadow: 0 10px 24px rgba(17, 20, 57, 0.35);
    }
    .btn-action:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    #result {
      font-size: 18px;
      font-weight: 700;
      margin-top: 20px;
      color: #e04850;
      min-height: 27px;
    }

      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-nav:hover { background: #e2decb; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-header {
      text-align: center;
      font-weight: 800;
      padding: 8px 0;
      color: #717588;
      font-size: 13px;

      border-radius: 16px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 4px;
      overflow: hidden;

      outline: none;

      border-radius: 6px;
      border: 1px solid #e04850;
      background: #fff;
      outline: none;
      box-sizing: border-box;
      margin-top: 3px;

    .empty-cell { background: transparent; border: none; }

      height: 250px;
      width: 100%;

      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .memo-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 11px;
      opacity: 0.7;

      background: transparent;
      border: none;
      color: currentColor;
      font-weight: 800;
      cursor: pointer;

<body>

<div class="container">

    <div class="roulette-wrapper">
      <div class="pointer"></div>

      <div class="wheel-center-stamp">

    </div>
    <button class="btn-action" id="spin-btn" onclick="spinWheel()">SPIN THE WHEEL</button>
    <div id="result">버튼을 눌러 오늘 갈 카페를 뽑아보세요!</div>
  </div>

  <!-- 캘린더 섹션 -->

    <div class="calendar-header">
      <button class="btn-nav" onclick="changeMonth(-1)">◀ Prev</button>

      <button class="btn-add-memo" onclick="addMemo()">메모 추가</button>
    </div>
    <div class="memo-board" id="memo-board"></div>
  </div>

  let activeCafes = [...rouletteCafes];

  let stampIdx = 0;

  function setCenterStamp() {
    const img = document.getElementById("stamp-center-img");
    img.src = stampSVGs[stampIdx];
    stampIdx = (stampIdx + 1) % stampSVGs.length;
  }

  function checkMonday() {
    const today = new Date();
    if (today.getDay() === 1) {
      activeCafes = rouletteCafes.filter(c => c !== "베르시");
    } else {
      activeCafes = [...rouletteCafes];
    }
  }

  function drawWheel() {
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const numOptions = activeCafes.length;
    const arc = (2 * Math.PI) / numOptions;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < numOptions; i++) {
      const angle = i * arc;
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(140, 140);
      ctx.arc(140, 140, 140, angle, angle + arc);
      ctx.fill();

      ctx.save();
      ctx.translate(140, 140);
      ctx.rotate(angle + arc / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = textColors[i % textColors.length] || "#ffffff";
      ctx.font = "bold 15px 'Plus Jakarta Sans', sans-serif";
      ctx.fillText(activeCafes[i], 120, 5);
      ctx.restore();
    }
  }

  function spinWheel() {
    if (isSpinning) return;
    isSpinning = true;
    document.getElementById("spin-btn").disabled = true;

    setCenterStamp();

    const canvas = document.getElementById("wheel");
    const numOptions = activeCafes.length;
    const randomDegrees = Math.floor(Math.random() * 360) + 1800;
    currentRotation += randomDegrees;

    canvas.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      isSpinning = false;
      document.getElementById("spin-btn").disabled = false;

      const actualRotation = currentRotation % 360;
      const degreesPerSegment = 360 / numOptions;
      let winningIndex = Math.floor((360 - (actualRotation % 360) + 270) % 360 / degreesPerSegment);
      const selectedCafe = activeCafes[winningIndex];

      const today = new Date();
      let noteText = today.getDay() === 1 ? " (월요일이라 베르시는 제외했어요!)" : "";
      
      document.getElementById("result").innerText = `✨ 오늘 추천 카페: [ ${selectedCafe} ]` + noteText;
    }, 3500);
  }

  // ------------------ Firebase 동기화 ------------------
  window.initFirebaseSync = function() {
    const logsRef = window.dbRef(window.db, 'cafe_logs');
    window.dbOnValue(logsRef, (snapshot) => {
      sharedLogs = snapshot.val() || {};
      renderCalendar();
      updateChart();
    });

    const memoRef = window.dbRef(window.db, 'walk_memos');
    window.dbOnValue(memoRef, (snapshot) => {
      sharedMemos = snapshot.val() || {};
      renderMemos();
    });
  };

  function saveLog(dateKey, value) {
    const logRef = window.dbRef(window.db, `cafe_logs/${dateKey}`);
    if (value) {
      window.dbSet(logRef, value);
    } else {
      window.dbRemove(logRef);
    }
  }

  // ------------------ 메모 기능 ------------------
  function addMemo() {
    const input = document.getElementById("memo-input");
    const text = input.value.trim();
    if (!text) return;

    const memoRef = window.dbRef(window.db, 'walk_memos');
    const now = new Date();
    const timeString = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    window.dbPush(memoRef, {
      text: text,
      timestamp: timeString,
      colorIdx: Math.floor(Math.random() * 4)
    });

    input.value = "";
  }

  function deleteMemo(key) {
    const memoRef = window.dbRef(window.db, `walk_memos/${key}`);
    window.dbRemove(memoRef);
  }

  function renderMemos() {
    const board = document.getElementById("memo-board");
    board.innerHTML = "";

    const entries = Object.entries(sharedMemos);
    if (entries.length === 0) {
      board.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; font-size: 13px; padding: 20px 0;">아직 남겨진 메모가 없습니다. 첫 메모를 작성해 보세요!</div>`;
      return;
    }

    entries.reverse().forEach(([key, memo]) => {
      const card = document.createElement("div");
      card.className = `memo-card memo-card-bg-${memo.colorIdx || 0}`;

      const content = document.createElement("div");
      content.className = "memo-content";
      content.innerText = memo.text;

      const footer = document.createElement("div");
      footer.className = "memo-footer";
      footer.innerHTML = `<span>${memo.timestamp || ''}</span>`;

      const delBtn = document.createElement("button");
      delBtn.className = "btn-delete-memo";
      delBtn.innerText = "✕";
      delBtn.onclick = () => deleteMemo(key);

      footer.appendChild(delBtn);
      card.appendChild(content);
      card.appendChild(footer);
      board.appendChild(card);
    });
  }

  // ------------------ 캘린더 ------------------
  let currentDate = new Date();

  function renderCalendar() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("month-title").innerText = `${year}. ${String(month + 1).padStart(2, '0')}`;

    const grid = document.getElementById("calendar-grid");
    grid.innerHTML = "";

    const days = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    days.forEach((day, idx) => {
      const header = document.createElement("div");
      header.className = `day-header ${idx === 0 ? 'sun' : idx === 6 ? 'sat' : ''}`;
      header.innerText = day;
      grid.appendChild(header);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement("div");
      empty.className = "day-cell empty-cell";
      grid.appendChild(empty);
    }

    for (let date = 1; date <= lastDate; date++) {
      const cell = document.createElement("div");
      cell.className = "day-cell";

      const dateObj = new Date(year, month, date);
      const dayOfWeek = dateObj.getDay();
      const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;

      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      const krHolidayName = krHolidays[dateKey];
      const isKrHoliday = !!krHolidayName;
      const isDayOff = isWeekend || isKrHoliday;

      if (dayOfWeek === 0) cell.classList.add("sun");
      if (dayOfWeek === 6) cell.classList.add("sat");
      if (isKrHoliday) cell.classList.add("is-kr-holiday");
      if (isDayOff) cell.classList.add("is-off");

      const dateNum = document.createElement("div");
      dateNum.className = "day-number";
      dateNum.innerText = date;
      cell.appendChild(dateNum);

      const badgeContainer = document.createElement("div");
      badgeContainer.className = "holiday-badge-container";

      if (krHolidayName) {
        const b = document.createElement("div");
        b.className = "holiday-badge badge-kr";
        b.innerText = `🇰🇷 ${krHolidayName}`;
        badgeContainer.appendChild(b);
      }

      if (foreignHolidays.VN[dateKey]) {
        const b = document.createElement("div");
        b.className = "holiday-badge badge-vn";
        b.innerText = `🇻🇳 ${foreignHolidays.VN[dateKey]}`;
        badgeContainer.appendChild(b);
      }
      if (foreignHolidays.HK[dateKey]) {
        const b = document.createElement("div");
        b.className = "holiday-badge badge-hk";
        b.innerText = `🇭🇰 ${foreignHolidays.HK[dateKey]}`;
        badgeContainer.appendChild(b);
      }
      if (foreignHolidays.NY[dateKey]) {
        const b = document.createElement("div");
        b.className = "holiday-badge badge-ny";
        b.innerText = `🇺🇸 ${foreignHolidays.NY[dateKey]}`;
        badgeContainer.appendChild(b);
      }

      cell.appendChild(badgeContainer);

      // 평일일 때만 카페 선택 드롭다운 생성
      if (!isDayOff) {
        const savedCafe = sharedLogs[dateKey] || "";
        let savedType = typeof savedCafe === 'string' ? savedCafe : (savedCafe.cafe || "");
        let savedCustomCafeName = "";

        if (savedType.startsWith("기타:")) {
          savedCustomCafeName = savedType.replace("기타:", "");
          savedType = "기타";
        }

        const select = document.createElement("select");
        select.className = "select-cafe";
        
        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.innerText = "Select Cafe";
        select.appendChild(defaultOpt);

        rouletteCafes.forEach(cafe => {
          const opt = document.createElement("option");
          opt.value = cafe;
          opt.innerText = cafe;
          if (cafe === savedType) opt.selected = true;
          select.appendChild(opt);
        });

        const etcOpt = document.createElement("option");
        etcOpt.value = "기타";
        etcOpt.innerText = "기타 (직접입력)";
        if (savedType === "기타") etcOpt.selected = true;
        select.appendChild(etcOpt);

        const customCafeInput = document.createElement("input");
        customCafeInput.type = "text";
        customCafeInput.className = "input-custom-cafe";
        customCafeInput.placeholder = "카페명 입력";
        customCafeInput.value = savedCustomCafeName;
        customCafeInput.style.display = savedType === "기타" ? "block" : "none";

        select.onchange = (e) => {
          const val = e.target.value;
          if (val === "기타") {
            customCafeInput.style.display = "block";
            customCafeInput.focus();
            if (customCafeInput.value.trim()) {
              saveLog(dateKey, `기타:${customCafeInput.value.trim()}`);
            }
          } else {
            customCafeInput.style.display = "none";
            saveLog(dateKey, val);
          }
        };

        customCafeInput.oninput = (e) => {
          const customVal = e.target.value.trim();
          if (customVal) {
            saveLog(dateKey, `기타:${customVal}`);
          } else {
            saveLog(dateKey, "기타:");
          }
        };

        cell.appendChild(select);
        cell.appendChild(customCafeInput);
      }

      grid.appendChild(cell);
    }
  }

  function changeMonth(delta) {
    currentDate.setMonth(currentDate.getMonth() + delta);
    renderCalendar();
  }

  // ------------------ 차트 ------------------
  function updateChart() {
    const counts = {};
    rouletteCafes.forEach(cafe => counts[cafe] = 0);

    Object.values(sharedLogs).forEach(dayData => {
      let cafeName = typeof dayData === 'string' ? dayData : (dayData ? dayData.cafe : "");

      if (cafeName) {
        let name = cafeName;
        if (name.startsWith("기타:")) {
          name = name.replace("기타:", "").trim();
        }
        if (name) {
          if (!counts.hasOwnProperty(name)) {
            counts[name] = 0;
          }
          counts[name]++;
        }
      }
    });

    const labels = Object.keys(counts);
    const dataValues = labels.map(label => counts[label]);
    const bgColors = labels.map((_, idx) => colors[idx % colors.length]);

    if (chartInstance) {
      chartInstance.data.labels = labels;
      chartInstance.data.datasets[0].data = dataValues;
      chartInstance.data.datasets[0].backgroundColor = bgColors;
      chartInstance.update();
    } else {
      const ctx = document.getElementById('visitChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Visits',
            data: dataValues,
            backgroundColor: bgColors,
            borderRadius: 12,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#717588' },
              grid: { color: 'rgba(0, 0, 0, 0.04)' }
            },
            x: {
              ticks: { color: '#111439', font: { weight: 'bold' } },
              grid: { display: false }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }
  }

  checkMonday();
  setCenterStamp();
  drawWheel();
  renderCalendar();
</script>
